<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCISO-IDT</title>
<meta name="description" content="Oficina de Compensaciones Industriales y Sociales Offset para la Innovación y el Desarrollo Tecnológico. Universidad Nacional de Ingeniería.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0A2540;
    color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:32px 28px;
  }

  .meta {
    font-family:"Courier New",monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    line-height:1.9;
  }

  header {
    border-bottom:1px solid #fff;
    padding-bottom:14px;
  }

  main {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:64px 0;
  }

  h1 {
    font-size:clamp(56px,17vw,220px);
    font-weight:700;
    letter-spacing:-.04em;
    line-height:.88;
    text-transform:uppercase;
  }

  h2 {
    font-size:clamp(15px,2.4vw,26px);
    font-weight:400;
    line-height:1.3;
    max-width:22ch;
    margin-top:28px;
    text-transform:uppercase;
  }

  .estado {
    border-top:1px solid #fff;
    border-bottom:1px solid #fff;
    margin-top:56px;
    padding:16px 0;
    font-family:"Courier New",monospace;
    font-size:clamp(13px,2vw,18px);
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  footer {
    border-top:1px solid #fff;
    padding-top:14px;
    display:flex;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
</style>
</head>
<body>

<header class="meta">
  Universidad Nacional de Ingeniería<br>
  Facultad de Ingeniería Mecánica
</header>

<main>
  <h1>OCISO<br>IDT</h1>
  <h2>Oficina de Compensaciones Industriales y Sociales Offset para la Innovación y el Desarrollo Tecnológico</h2>
  <div class="estado">Sitio en construcción / Próximamente</div>
</main>

<footer class="meta">
  <span>Lima — Perú</span>
  <span>2026</span>
</footer>

</body>
</html>
